[project]
name = "reels-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "playwright>=1.64.0",
    "psutil>=7.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]
# сервер (uv sync --group server): скачивание без куки и OCR, на ноуте не нужны
server = ["yt-dlp", "gallery-dl", "rapidocr>=3.10", "onnxruntime>=1.20", "pillow"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
